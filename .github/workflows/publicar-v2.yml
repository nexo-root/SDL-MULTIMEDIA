# Publicador v2: obedece las fechas que se ponen desde el Panel CMD.
# PRENDIDO el 28/09/2026, en el mismo commit que apago el schedule de publicar-flyer.yml.
# Nunca los dos a la vez: publicarian doble.
name: Publicar (v2, por fecha)

on:
  # GitHub corre los horarios cuando puede: el 28/09 el de las 10:00 ART salio a las 17:03. Por eso hay OCHO
  # intentos cada media hora (minutos impares, que es cuando GitHub esta menos cargado). El primero que corre
  # publica; los demas ven que hoy ya salio una y no hacen nada (una por dia, ver publicar_v2.py).
  schedule:
    - cron: '52 12 * * *'   # 09:52 ART
    - cron: '22 13 * * *'   # 10:22
    - cron: '52 13 * * *'   # 10:52
    - cron: '22 14 * * *'   # 11:22
    - cron: '52 14 * * *'   # 11:52
    - cron: '22 15 * * *'   # 12:22
    - cron: '52 15 * * *'   # 12:52
    - cron: '22 16 * * *'   # 13:22
  workflow_dispatch:
    inputs:
      modo:
        description: 'simular = no publica nada · registrar = solo arma publicadas.json · publicar = de verdad'
        type: choice
        options: [simular, registrar, publicar]
        default: simular

permissions:
  contents: write   # para anotar publicadas.json

concurrency:
  group: fabrica-publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correr el publicador
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODO: ${{ github.event.inputs.modo || 'publicar' }}
        run: |
          case "$MODO" in
            simular)   python rutina/publicar_v2.py --simular ;;
            registrar) python rutina/publicar_v2.py --registrar ;;
            *)         python rutina/publicar_v2.py ;;
          esac
      - name: Guardar el registro de lo publicado
        if: always()
        run: |
          git config user.name "fabrica-de-flyers"
          git config user.email "fabrica@users.noreply.github.com"
          git add rutina/publicadas.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Fabrica: registro de publicadas"
          # El panel puede haber guardado mientras tanto: se acomoda arriba de lo ultimo antes de subir.
          git pull --rebase --autostash && git push
